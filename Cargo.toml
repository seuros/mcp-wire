[workspace]
members = ["crates/mcp-wire", "crates/mcp-guest"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
repository = "https://github.com/seuros/mcp-wire"
authors = ["Abdelkader Boudih <oss@seuros.com>"]

[workspace.dependencies]
mcp-wire = { version = "0.1.0", path = "crates/mcp-wire" }
base64 = "0.23.1"
chrono-machines = { version = "0.11", features = ["std"] }
jiff = "0.2"
rand = "0.10"
serde = "1"
serde_json = "1"
state-machines = { version = "0.34", features = ["dynamic", "async", "runtime-send"] }
thiserror = "2"
tokio = "1"
tokio-stream = "0.1.19"
url = "2"

# mcp-host depends on mcp-wire from crates.io; resolve it to this workspace's
# copy so host and guest share one set of wire types.
[patch.crates-io]
mcp-wire = { path = "crates/mcp-wire" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
must_use_candidate = "allow"
redundant_pub_crate = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
